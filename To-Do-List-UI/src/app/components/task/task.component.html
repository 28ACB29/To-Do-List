<div class="task">
  <div class="task-header">
    <h3>{{ task.name }}</h3>
    <div class="actions">
      <button (click)="onEdit()">Edit</button>
      <button (click)="onDelete()">Delete</button>
    </div>
  </div>
  <p *ngIf="task.description">{{ task.description }}</p>
  <label>
    Status:
    {{ task.status }}
  </label>
</div>
